};

/* ============ HELPERS ============ */
const uid=()=>Math.random().toString(36).slice(2,10);
const todayStr = () => new Date().toISOString().slice(0,10);
function isFuture(d){ return d && d > todayStr(); }
function txDate(r, key){ return (r && (r[key] || (r.created_at ? r.created_at.slice(0,10) : ''))) || ''; }
function txDT(r, key){ if(!r) return '-'; const d = txDate(r, key); if(!d) return '-'; return fmtDate(d) + (r.tx_time ? ' ' + r.tx_time : ''); }
function enteredOn(r){ if(!r || !r.created_at) return ''; const d = new Date(r.created_at); return 'Entered: ' + d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) + ' ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
function dateTimeFieldHTML(dateVal, timeVal, label){
  const today = todayStr();
  return `<div class="grid-2">
    <div><label class="label">${label||'Date'} *</label><input class="input" type="date" name="tx_date" required max="${today}" value="${dateVal||today}"></div>
    <div><label class="label">Time (optional)</label><input class="input" type="time" name="tx_time" value="${timeVal||''}"></div>
  </div>`;
}
function readDateTime(form){
  const dateEl = form.querySelector('input[name="tx_date"]');
  const timeEl = form.querySelector('input[name="tx_time"]');
  const d = dateEl ? dateEl.value : '';
  const tm = (timeEl && timeEl.value ? timeEl.value : '').trim();
  if(!d){ toast('Please pick a date','error'); return null; }
  if(isFuture(d)){ toast('Future dates are not allowed','error'); return null; }
  return { date: d, time: tm };
}

const fmt=n=>Number(n||0).toFixed(2);
function inr(n){
  const num = Number(n||0); const neg = num < 0; const s = Math.abs(num).toFixed(2);
  const parts = s.split('.'); let intPart = parts[0]; const decPart = parts[1];
  if(intPart.length > 3){
    const last3 = intPart.slice(-3); const rest = intPart.slice(0, -3);
    intPart = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
  }
  return (neg?'-':'') + intPart + '.' + decPart;
}
const rs=n=>'₹'+inr(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>{if(!d)return '-';const s=String(d).slice(0,10);return new Date(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});};
function fmtNum(n){ const v = Number(n||0); return v % 1 === 0 ? String(v) : v.toFixed(2); }

function productDisplay(p){
  if(p.dual){
    const packs = p.pack_size ? Number(p.stock) / Number(p.pack_size) : 0;
    const packStr = fmtNum(packs) + ' ' + p.pack_unit + (packs===1?'':'s');
    const baseStr = fmtNum(p.stock) + ' ' + p.base_unit;
    const primaryIsPack = p.primary_unit === 'pack_unit';
    const primary = primaryIsPack ? packStr : baseStr;
    const secondary = primaryIsPack ? baseStr : packStr;
    return { primary, secondary, stockLabel: primary, packStr, baseStr, fullText: primary + ' (' + secondary + ')',
      subline: fmtNum(p.pack_size) + ' ' + p.base_unit + ' / ' + p.pack_unit + (p.price_pack>0?' - ₹'+p.price_pack+'/'+p.pack_unit:'') + (p.price_base>0?' - ₹'+p.price_base+'/'+p.base_unit:''),
      priceText: (p.price_pack>0?'₹'+p.price_pack+'/'+p.pack_unit:'') + (p.price_pack>0&&p.price_base>0?' - ':'') + (p.price_base>0?'₹'+p.price_base+'/'+p.base_unit:'') };
  }
  const str = fmtNum(p.stock) + ' ' + p.unit;
  return { primary: str, secondary: '', stockLabel: str, packStr: '', baseStr: str, fullText: str, subline: '₹' + p.price + '/' + p.unit, priceText: '₹' + p.price + '/' + p.unit };
}
function isLowStock(p){ return Number(p.stock) <= Number(p.low_stock_alert); }
function isOutOfStock(p){ return Number(p.stock) <= 0; }
function stockBadge(p){
  if(isOutOfStock(p)) return '<span style="background:#e2e8f0;color:#475569;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:600">OUT OF STOCK</span>';
  if(isLowStock(p)) return '<span style="background:#fee2e2;color:#b91c1c;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:600">LOW</span>';
  return '<span style="background:#dcfce7;color:#15803d;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:600">OK</span>';
}
function productLineLabel(line){
  if(line.dual){
    if(line.unit === line.pack_unit) return line.product_name + ' - ' + fmtNum(line.pack_size) + ' ' + line.base_unit;
    return line.product_name + ' - ' + line.unit;
  }
  return line.product_name + ' - ' + (line.unit || '');
}
function lineDeductBaseQty(line){
  if(line.dual && line.unit === line.pack_unit) return Number(line.qty) * Number(line.pack_size);
  return Number(line.qty);
}

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function toast(msg,type='info'){const el=document.createElement('div');el.className='toast toast-'+type;el.textContent=msg;$('#toast-root').appendChild(el);setTimeout(()=>el.remove(),3500);}
function openModal(html,onMount){const root=$('#modal-root');root.innerHTML=`<div class="modal-overlay"><div class="modal">${html}</div></div>`;root.querySelector('.modal-overlay').addEventListener('click',e=>{if(e.target.classList.contains('modal-overlay'))closeModal();});if(onMount)onMount(root);}
function closeModal(){$('#modal-root').innerHTML='';}
function computeRating(c){if(!c.total_bought||Number(c.total_bought)===0)return 5;const ratio=Number(c.total_paid)/Number(c.total_bought);let score=ratio*5;if(Number(c.due)>0){const d=Number(c.due)/Number(c.total_bought);if(d>0.5)score-=1.5;else if(d>0.25)score-=0.8;}return Math.max(1,Math.min(5,Math.round(score*10)/10));}
function nextInvoiceNo(){
  let max = 0;
  DB.invoices.forEach(inv => { const m = String(inv.invoice_no||'').match(/(\d+)/); if(m){ const n = parseInt(m[1]); if(n > max) max = n; } });
  return 'KB-' + String(max + 1).padStart(4, '0');
}
function checkStock(lines){
  for(const l of lines){
    const p = DB.products.find(x => x.id === l.product_id); if(!p) continue;
    const need = lineDeductBaseQty(l);
    if(Number(p.stock) < need){
      const unit = (p.dual?p.base_unit:p.unit);
      return { ok:false, productName:p.name, need, available:Number(p.stock), unit };
    }
  }
  return { ok:true };
}
function confirmDlg(message, title){ return confirm((title ? title + '\n\n' : '') + message); }
function getOverdue30(){
  const today = new Date(); let total = 0; const list = [];
  DB.invoices.forEach(inv => {
    if(Number(inv.due) <= 0) return;
    const d = new Date(txDate(inv,'invoice_date'));
    const ageDays = Math.floor((today - d) / (1000*60*60*24));
    if(ageDays >= 30){
      const c = DB.customers.find(x => x.id === inv.customer_id);
      total += Number(inv.due);
      list.push({ ...inv, ageDays, customerName: c?.name || 'Walk-in', customerPhone: c?.phone || '' });
    }
  });
  list.sort((a,b) => b.ageDays - a.ageDays);
  return { total, list };
}
function supplierTotals(sid){
  const sup = DB.suppliers.find(s=>s.id===sid);
  const bills = DB.supplier_invoices.filter(b=>b.supplier_id===sid);
  const pays = DB.supplier_payments.filter(p=>p.supplier_id===sid);
  const total_purchase = bills.reduce((s,b)=>s+Number(b.total),0);
  const bill_paid = bills.reduce((s,b)=>s+Number(b.paid||0),0);
  const extra_paid = pays.reduce((s,p)=>s+Number(p.amount),0);
  const total_paid = bill_paid + extra_paid;
  const opening = Number(sup?.opening_balance||0);
  const total_due = Math.max(0, opening + total_purchase - total_paid);
  return { total_purchase, total_paid, total_due, bill_paid, extra_paid, opening };
}

/* ============ SUPABASE SYNC ============ */
async function syncDB(){
  try{
    const [cust, prod, inv, items, pays, sup, sinv, spays, ret, sett] = await Promise.all([
      sb.from('customers').select('*').order('created_at',{ascending:false}),
      sb.from('products').select('*').order('name'),
      sb.from('invoices').select('*').order('invoice_date',{ascending:false}),
      sb.from('invoice_items').select('*'),
      sb.from('payments').select('*').order('payment_date',{ascending:false}),
      sb.from('suppliers').select('*').order('name'),
      sb.from('supplier_invoices').select('*').order('bill_date',{ascending:false}),
      sb.from('supplier_payments').select('*').order('payment_date',{ascending:false}),
      sb.from('returns').select('*').order('return_date',{ascending:false}),
      sb.from('settings').select('*').eq('id',1).maybeSingle()
    ]);
    if(cust.error) console.warn('cust', cust.error.message);
    if(prod.error) console.warn('prod', prod.error.message);
    DB.customers = cust.data || [];
    DB.products = prod.data || [];
    DB.invoices = inv.data || [];
    DB.invoice_items = items.data || [];
    DB.payments = pays.data || [];
    DB.suppliers = sup.data || [];
    DB.supplier_invoices = sinv.data || [];
    DB.supplier_payments = spays.data || [];
    DB.returns = ret.data || [];
    if(sett.data){
      SETTINGS = {
        shop_name: sett.data.shop_name || 'Krishi Bandhu',
        owner_name: sett.data.owner_name || 'Gourgopal Das',
        address: sett.data.address || '',
        license: sett.data.license || '',
        upi: sett.data.upi || '',
        phone: sett.data.phone || '',
        email: sett.data.email || '',
        logo: sett.data.logo || ''
      };
    }
    applyFavicon();
  }catch(e){
    console.error('syncDB failed', e);
    toast('Could not load data: '+e.message,'error');
  }
}
async function saveSettings(){
  const { error } = await sb.from('settings').upsert({
    id: 1, shop_name: SETTINGS.shop_name, owner_name: SETTINGS.owner_name,
    address: SETTINGS.address, license: SETTINGS.license, upi: SETTINGS.upi,
    phone: SETTINGS.phone, email: SETTINGS.email, logo: SETTINGS.logo,
    updated_at: new Date().toISOString()
  });
  if(error){ toast('Save failed: '+error.message,'error'); return false; }
  return true;
}
function logoHtml(size=40){

function searchSelectHTML(id, placeholder){
  return `<div class="searchselect" id="${id}">
    <input type="text" class="input ss-input" placeholder="${placeholder||'Search...'}" autocomplete="off" style="padding-right:32px">
    <button type="button" class="ss-clear" style="display:none">X</button>
    <div class="ss-dropdown"></div>
    <input type="hidden" class="ss-value" value="">
  </div>`;
}
function mountSearchSelect(rootEl, opts){
  const input = rootEl.querySelector('.ss-input');
  const dropdown = rootEl.querySelector('.ss-dropdown');
  const clearBtn = rootEl.querySelector('.ss-clear');
  const hidden = rootEl.querySelector('.ss-value');
  let activeIdx = -1; let filtered = []; let items = opts.items || [];
  function render(query){
    const q = (query||'').toLowerCase().trim();
    filtered = items.filter(it => !q || it.searchText.toLowerCase().includes(q));
    let html = '';
    if(filtered.length === 0){ html = `<div class="ss-empty">No matches found</div>`; }
    else {
      html = filtered.map((it, i) => `<div class="ss-item ${i===activeIdx?'active':''}" data-idx="${i}"><div style="flex:1;min-width:0;overflow:hidden"><div class="sname">${esc(it.label)}</div>${it.sublabel?`<div class="ssub">${esc(it.sublabel)}</div>`:''}</div><div class="smeta">${it.dueText?`<div class="due">${esc(it.dueText)}</div>`:''}${it.ratingText?`<div class="rat">${esc(it.ratingText)}</div>`:''}</div></div>`).join('');
    }
    if(opts.allowAdd){ html += `<div class="ss-add">+ Add new customer</div>`; }
    dropdown.innerHTML = html;
    dropdown.classList.add('open');
    dropdown.querySelectorAll('.ss-item').forEach(el => { el.onclick = () => pick(parseInt(el.dataset.idx)); });
    const addEl = dropdown.querySelector('.ss-add');
    if(addEl) addEl.onclick = () => { dropdown.classList.remove('open'); if(opts.onAdd) opts.onAdd(); };
  }
  function pick(i){
    const it = filtered[i]; if(!it) return;
    hidden.value = it.id;
    input.value = it.label + (it.sublabel ? ' - '+it.sublabel : '');
    dropdown.classList.remove('open');
    clearBtn.style.display = 'block';
    if(opts.onSelect) opts.onSelect(it);
  }
  function clear(){ hidden.value = ''; input.value = ''; clearBtn.style.display = 'none'; if(opts.onSelect) opts.onSelect(null); }
  input.addEventListener('focus', () => render(input.value.replace(/ - .*$/,'').trim()));
  input.addEventListener('input', () => { activeIdx = -1; hidden.value = ''; clearBtn.style.display = input.value ? 'block' : 'none'; render(input.value); });
  input.addEventListener('keydown', e => {
    if(!dropdown.classList.contains('open')) return;
    if(e.key === 'ArrowDown'){ e.preventDefault(); activeIdx = Math.min(activeIdx+1, filtered.length-1); render(input.value); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); activeIdx = Math.max(activeIdx-1, 0); render(input.value); }
    else if(e.key === 'Enter'){ e.preventDefault(); if(activeIdx >= 0) pick(activeIdx); }
    else if(e.key === 'Escape'){ dropdown.classList.remove('open'); }
  });
  clearBtn.onclick = (e) => { e.stopPropagation(); clear(); input.focus(); };
  document.addEventListener('click', e => { if(!rootEl.contains(e.target)) dropdown.classList.remove('open'); });
  rootEl.getValue = () => hidden.value;
  rootEl.setItems = (newItems) => { items = newItems; };
  rootEl.setValue = (id) => { const it = items.find(x => x.id === id); if(it){ hidden.value = id; input.value = it.label + (it.sublabel ? ' - '+it.sublabel : ''); clearBtn.style.display = 'block'; } };
  rootEl.reset = clear;
  return rootEl;
}

function shareUrlFor(token){ if(!token) return ''; if(location.protocol.startsWith('http')) return location.origin+location.pathname+'#/c/'+token; return ''; }
function dueReminder(name,due,inv,shareToken){
  const amt = Number(due).toFixed(2); const invLine = inv ? `\nইনভয়েস: ${inv}` : ''; let shareLine = '';

let calcOpen = false;
function toggleCalc(){
  calcOpen = !calcOpen;
  const root = $('#calc-root');
  if(!calcOpen){ root.innerHTML=''; return; }
  let val = '0';
  const render = () => {
    root.innerHTML = `<div class="calc"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:13px;font-weight:500">Calculator</span><button class="btn btn-ghost btn-sm" id="calc-close">X</button></div><div class="calc-display">${val}</div><div class="calc-keys">${['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C','BK'].map(k=>{const op=['/','*','-','+','='].includes(k)?'op':'';const lbl = k==='BK'?'<':k;return `<button class="${op}" data-k="${k}">${lbl}</button>`;}).join('')}</div></div>`;
    $('#calc-close').onclick = toggleCalc;
    $$('#calc-root button[data-k]').forEach(b => b.onclick = () => push(b.dataset.k));
  };
  const push = k => {
    if(k==='C') val = '0';
    else if(k==='BK') val = val.length>1 ? val.slice(0,-1) : '0';
    else if(k==='='){ try{ val = String(Function('"use strict";return ('+val+')')()); }catch{ val='Err'; } }
    else val = val==='0' ? k : val+k;
    render();
  };
  render();
}

        const tables = ['customers','products','invoices','invoice_items','payments','suppliers','supplier_invoices','supplier_payments','returns'];

            if(error) console.warn(tbl, error.message);
          }
        }
        if(data.settings){ SETTINGS = { ...SETTINGS, ...data.settings }; await saveSettings(); }
        await syncDB();
        toast('Backup restored','success');
        route();
      }catch(err){ toast('Failed: '+err.message,'error'); }
      e.target.value = '';

      if(flt === 'due' && !(Number(c.due) > 0)) return false;
      if(flt === 'nodue' && Number(c.due) > 0) return false;
      return true;
    });

    else if(sortBy === 'name-desc') arr.sort((a,b)=>b.name.localeCompare(a.name));
    else if(sortBy === 'due-desc') arr.sort((a,b)=>Number(b.due)-Number(a.due));
    else if(sortBy === 'due') arr.sort((a,b)=>Number(a.due)-Number(b.due));

      const c = DB.customers.find(x => x.id === b.dataset.edit);

  bindReport('cust','All Customers',kpis,tables);

function openCustomerFormModal(onCreated, existing){

  openModal(`

function renderProducts(content){
  const list = DB.products;

  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="page-head"><h1 style="font-size:22px;font-weight:700">Products &amp; Inventory</h1><div class="page-actions"><button id="add-prod" class="btn btn-primary">+ Add Product</button>${reportButtonsHTML('prod')}</div></div>

        <div style="flex:1;min-width:140px"><label class="label">Category</label><select class="input" id="prod-cat"><option value="">All</option>${categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
        <div style="flex:1;min-width:140px"><label class="label">Sort</label><select class="input" id="prod-sort"><option value="name">Name (A-Z)</option><option value="name-desc">Name (Z-A)</option><option value="stock">Stock (low first)</option><option value="stock-desc">Stock (high first)</option></select></div>
        <div style="flex:0 0 auto"><label class="label">&nbsp;</label><select class="input" id="prod-filter"><option value="">All</option><option value="low">Low stock</option><option value="out">Out of stock</option></select></div>
      </div>

      <div class="grid-3" id="prod-grid"></div>
    </div>`;
  function filtered(){
    const q = ($('#prod-search').value||'').toLowerCase().trim();
    const cat = $('#prod-cat').value;
    const sortBy = $('#prod-sort').value;
    const flt = $('#prod-filter').value;
    let arr = list.filter(p => {
      const hay = (p.name+' '+(p.category||'')+' '+(p.unit||'')+' '+(p.base_unit||'')+' '+(p.pack_unit||'')+' '+(p.pack_size||'')).toLowerCase();
      if(q && !hay.includes(q)) return false;
      if(cat && p.category !== cat) return false;
      if(flt === 'low' && !isLowStock(p)) return false;
      if(flt === 'out' && !isOutOfStock(p)) return false;
      return true;
    });
    if(sortBy === 'name') arr.sort((a,b)=>a.name.localeCompare(b.name));
    else if(sortBy === 'name-desc') arr.sort((a,b)=>b.name.localeCompare(a.name));
    else if(sortBy === 'stock') arr.sort((a,b)=>Number(a.stock)-Number(b.stock));
    else if(sortBy === 'stock-desc') arr.sort((a,b)=>Number(b.stock)-Number(a.stock));
    return arr;
  }
  function renderGrid(){
    const arr = filtered();
    $('#prod-count').textContent = arr.length + ' of ' + list.length + ' products';
    const grid = $('#prod-grid');
    if(arr.length === 0){ grid.innerHTML = `<div class="card" style="grid-column:1/-1;text-align:center;padding:40px"><div style="font-size:48px">(none)</div><p style="color:var(--s500);margin:10px 0">No products match</p></div>`; return; }
    grid.innerHTML = arr.map(p=>{
      const d = productDisplay(p);
      return `<div class="card"><div style="display:flex;gap:10px"><div class="stat-icon" style="background:var(--b100);color:var(--b700);margin:0">P</div><div style="flex:1;min-width:0"><div style="font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap">${esc(p.name)}${p.dual?'<span style="font-size:10px;color:var(--b700);background:var(--b50);padding:2px 6px;border-radius:6px">DUAL</span>':''}${stockBadge(p)}</div><div style="font-size:11px;color:var(--s500);margin-top:2px">${esc(d.subline)}</div><div style="font-size:13px;margin-top:6px;font-weight:500;color:${isOutOfStock(p)?'var(--s400)':(isLowStock(p)?'var(--r600)':'var(--s700)')}">${esc(d.fullText)}</div></div><div style="display:flex;flex-direction:column;gap:4px"><button class="btn btn-ghost btn-sm" data-edit="${p.id}">Edit</button><button class="btn btn-ghost btn-sm" data-del="${p.id}">Del</button></div></div></div>`;
    }).join('');
    $$('[data-del]',grid).forEach(b=>b.onclick=async()=>{
      const p = DB.products.find(x => x.id === b.dataset.del);
      if(!confirmDlg('Delete "'+(p?.name||'product')+'"?','Confirm Delete')) return;
      const { error } = await sb.from('products').delete().eq('id', b.dataset.del);
      if(error){ toast(error.message,'error'); return; }
      await syncDB(); toast('Deleted','success'); renderGrid();
    });
    $$('[data-edit]',grid).forEach(b=>b.onclick=()=>{
      const p = DB.products.find(x => x.id === b.dataset.edit);
      openProductForm(p);
    });
  }
  ['prod-search','prod-cat','prod-sort','prod-filter'].forEach(id => { $('#'+id).oninput = renderGrid; $('#'+id).onchange = renderGrid; });
  $('#add-prod').onclick = () => openProductForm();
  renderGrid();
  const lowCount = list.filter(p=>isLowStock(p)).length;
  const outCount = list.filter(p=>isOutOfStock(p)).length;
  const kpis = [['Total Products',list.length],['Low Stock',lowCount],['Out of Stock',outCount]];
  const tables = [{head:['Product','Pack/Unit','Stock','Cost','Sell','Status'],rows:list.map(p=>{const d=productDisplay(p);const status = isOutOfStock(p)?'OUT':(isLowStock(p)?'LOW':'OK');const sell = p.dual?(p.price_base+'/'+p.base_unit+' - '+p.price_pack+'/'+p.pack_unit):(p.price+'/'+p.unit);return [p.name,d.subline,d.stockLabel,rs(p.cost),sell,status];})}];
  bindReport('prod','Stock Report',kpis,tables);
}

          <div><label class="label">Stock</label><input class="input" type="number" step="0.01" name="stock1" value="${p.stock||0}"></div>
          <div><label class="label">Low alert at</label><input class="input" type="number" name="low1" value="${p.low_stock_alert||5}"></div>
        </div>
      </div>
      <div id="dual-block" style="display:${p.dual?'block':'none'}">
        <div class="grid-2">
          <div><label class="label">Base unit</label><select class="input" name="base_unit">${BASE_UNITS.map(u=>`<option ${p.base_unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
          <div><label class="label">Pack unit</label><select class="input" name="pack_unit">${PACK_UNITS.map(u=>`<option ${p.pack_unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
        </div>
        <div style="margin-top:10px"><label class="label">1 <span class="pk-lbl">${p.pack_unit}</span> = <input class="input" type="number" step="0.01" name="pack_size" value="${p.pack_size||50}" style="display:inline-block;width:100px;margin:0 6px"> <span class="bs-lbl">${p.base_unit}</span></label></div>
        <div class="grid-2" style="margin-top:10px">
          <div><label class="label">Sell / base unit (₹)</label><input class="input" type="number" step="0.01" name="price_base" value="${p.price_base||0}"></div>
          <div><label class="label">Sell / pack (₹)</label><input class="input" type="number" step="0.01" name="price_pack" value="${p.price_pack||0}"></div>
          <div><label class="label">Cost / base unit (₹)</label><input class="input" type="number" step="0.01" name="cost" value="${p.cost||0}"></div>
          <div><label class="label">Stock (base unit)</label><input class="input" type="number" step="0.01" name="stock2" value="${p.stock||0}"></div>
          <div><label class="label">Low alert (base unit)</label><input class="input" type="number" name="low2" value="${p.low_stock_alert||5}"></div>
        </div>
        <div style="margin-top:10px"><label class="label">Primary display</label><select class="input" name="primary_unit"><option value="base_unit" ${p.primary_unit==='base_unit'?'selected':''}>Base unit first</option><option value="pack_unit" ${p.primary_unit==='pack_unit'?'selected':''}>Pack unit first</option></select></div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="prf-save">${existing?'Update':'Save'}</button></div>
    </form>`, root => {
    const dualSel = root.querySelector('[name="dual"]');
    const singleB = root.querySelector('#single-block');
    const dualB = root.querySelector('#dual-block');
    dualSel.onchange = () => { const isDual = dualSel.value === 'yes'; singleB.style.display = isDual?'none':'block'; dualB.style.display = isDual?'block':'none'; };
    const bu = root.querySelector('[name="base_unit"]'); const pu = root.querySelector('[name="pack_unit"]');
    const upLbls = () => { root.querySelectorAll('.pk-lbl').forEach(e=>e.textContent=pu.value); root.querySelectorAll('.bs-lbl').forEach(e=>e.textContent=bu.value); };
    if(bu){ bu.onchange = upLbls; pu.onchange = upLbls; upLbls(); }
    root.querySelector('#prf').onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const isDual = fd.get('dual') === 'yes';
      const name = (fd.get('name')||'').trim();
      if(!name){ toast('Enter product name','error'); return; }
      let data;
      if(isDual){
        const ps = Number(fd.get('pack_size'))||1;
        if(ps <= 0){ toast('Pack size must be > 0','error'); return; }
        data = { name, category: fd.get('category')||'', dual: true, base_unit: fd.get('base_unit'), pack_unit: fd.get('pack_unit'), pack_size: ps, price_base: Number(fd.get('price_base'))||0, price_pack: Number(fd.get('price_pack'))||0, cost: Number(fd.get('cost'))||0, stock: Number(fd.get('stock2'))||0, low_stock_alert: Number(fd.get('low2'))||0, primary_unit: fd.get('primary_unit')||'base_unit', unit: null, price: null };
      } else {
        data = { name, category: fd.get('category')||'', dual: false, unit: fd.get('unit'), price: Number(fd.get('price'))||0, cost: Number(fd.get('cost'))||0, stock: Number(fd.get('stock1'))||0, low_stock_alert: Number(fd.get('low1'))||0, base_unit: null, pack_unit: null, pack_size: null, price_base: 0, price_pack: 0, primary_unit: 'base_unit' };
      }
      const btn = root.querySelector('#prf-save'); btn.disabled = true; btn.textContent = 'Saving...';
      let result;
      if(existing) result = await sb.from('products').update(data).eq('id', existing.id).select().single();
      else result = await sb.from('products').insert(data).select().single();
      if(result.error){ toast(result.error.message,'error'); btn.disabled = false; btn.textContent = existing?'Update':'Save'; return; }
      await syncDB();
      toast(existing?'Updated':'Added','success');
      closeModal(); route();
    };
  });
}

function renderInvoices(content){
  const list = DB.invoices;
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="page-head"><h1 style="font-size:22px;font-weight:700">Invoices</h1><div class="page-actions"><a href="#/invoice/new" class="btn btn-primary">+ New Invoice</a>${reportButtonsHTML('inv')}</div></div>
      <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <div style="flex:2;min-width:200px"><label class="label">Search</label><input class="input" id="inv-search" placeholder="Invoice no, customer..."></div>
        <div style="flex:1;min-width:150px"><label class="label">Sort</label><select class="input" id="inv-sort"><option value="date-desc">Date (newest first)</option><option value="date">Date (oldest first)</option><option value="due-desc">Due (high first)</option><option value="total-desc">Total (high first)</option></select></div>
        <div style="flex:0 0 auto"><label class="label">&nbsp;</label><select class="input" id="inv-filter"><option value="">All</option><option value="due">Only with due</option><option value="paid">Fully paid</option></select></div>
      </div>
      <div id="inv-count" style="font-size:12px;color:var(--s500);padding:0 4px"></div>
      <div class="card" style="overflow-x:auto"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th style="text-align:right">Total</th><th style="text-align:right">Paid</th><th style="text-align:right">Due</th><th></th></tr></thead><tbody id="inv-body"></tbody></table></div>
    </div>`;
  function filtered(){
    const q = ($('#inv-search').value||'').toLowerCase().trim();
    const sortBy = $('#inv-sort').value;
    const flt = $('#inv-filter').value;
    let arr = list.filter(i => {
      const c = DB.customers.find(x => x.id === i.customer_id);
      const hay = (i.invoice_no+' '+(c?.name||'')+' '+(c?.phone||'')).toLowerCase();
      if(q && !hay.includes(q)) return false;
      if(flt === 'due' && !(Number(i.due) > 0)) return false;
      if(flt === 'paid' && Number(i.due) > 0) return false;
      return true;
    });
    if(sortBy === 'date-desc') arr.sort((a,b)=>txDate(b,'invoice_date').localeCompare(txDate(a,'invoice_date')));
    else if(sortBy === 'date') arr.sort((a,b)=>txDate(a,'invoice_date').localeCompare(txDate(b,'invoice_date')));
    else if(sortBy === 'due-desc') arr.sort((a,b)=>Number(b.due)-Number(a.due));
    else if(sortBy === 'total-desc') arr.sort((a,b)=>Number(b.total)-Number(a.total));
    return arr;
  }
  function renderTable(){
    const arr = filtered();
    $('#inv-count').textContent = arr.length + ' of ' + list.length + ' invoices';
    $('#inv-body').innerHTML = arr.length === 0
      ? '<tr><td colspan="7" style="text-align:center;padding:40px"><div style="font-size:40px">(none)</div><p style="color:var(--s500);margin:8px 0">No invoices match</p><a href="#/invoice/new" class="btn btn-primary">+ New Invoice</a></td></tr>'
      : arr.map(i=>{
          const c = DB.customers.find(x => x.id === i.customer_id);
          return `<tr><td><a href="#/invoice/${i.id}" style="font-weight:500">${i.invoice_no}</a></td><td>${esc(c?.name||'Walk-in')}</td><td>${txDT(i,'invoice_date')}</td><td style="text-align:right">${rs(i.total)}</td><td style="text-align:right;color:var(--b700)">${rs(i.paid)}</td><td style="text-align:right;color:${Number(i.due)>0?'var(--r600)':'var(--s400)'};font-weight:${Number(i.due)>0?'600':'400'}">${rs(i.due)}</td><td style="text-align:right;white-space:nowrap"><button class="btn btn-ghost btn-sm" data-del-inv="${i.id}" style="color:var(--r600)">Del</button></td></tr>`;
        }).join('');
    $$('[data-del-inv]').forEach(b=>b.onclick=async()=>{
      const inv = DB.invoices.find(x => x.id === b.dataset.delInv);
      if(!inv) return;
      const c = DB.customers.find(x => x.id === inv.customer_id);
      if(!confirmDlg('Delete invoice '+inv.invoice_no+' for ₹'+inr(inv.total)+'?\n\nCustomer: '+(c?.name||'Walk-in')+'\n\nStock will be restored.','Confirm Delete')) return;
      const items = DB.invoice_items.filter(x => x.invoice_id === inv.id);
      for(const it of items){
        const p = DB.products.find(x => x.id === it.product_id);
        if(p){ const back = lineDeductBaseQty(it); await sb.from('products').update({ stock: Number(p.stock) + back }).eq('id', p.id); }
      }
      await sb.from('invoices').delete().eq('id', inv.id);
      await syncDB();
      toast('Invoice deleted - stock restored','success');
      renderTable();
    });
  }
  ['inv-search','inv-sort','inv-filter'].forEach(id => { $('#'+id).oninput = renderTable; $('#'+id).onchange = renderTable; });
  renderTable();
  const total = list.reduce((s,i)=>s+Number(i.total),0);
  const paid = list.reduce((s,i)=>s+Number(i.paid),0);
  const due = list.reduce((s,i)=>s+Number(i.due),0);
  const kpis = [['Total Invoices',list.length],['Total Sales',rs(total)],['Total Paid',rs(paid)],['Total Due',rs(due)]];
  const tables = [{head:['Invoice','Customer','Date','Subtotal','Discount','Total','Paid','Due'],rows:list.map(i=>{const c=DB.customers.find(x=>x.id===i.customer_id);return [i.invoice_no,c?.name||'Walk-in',txDT(i,'invoice_date'),rs(i.subtotal),rs(i.discount),rs(i.total),rs(i.paid),rs(i.due)];})}];
  bindReport('inv','Invoice Register',kpis,tables);
}

function renderNewInvoice(content){
  const ps = DB.products;
  let lines = [];
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="page-head"><h1 style="font-size:22px;font-weight:700">New Invoice</h1><div class="page-actions">${reportButtonsHTML('nv')}</div></div>
      <div class="card" style="display:flex;flex-direction:column;gap:14px">
        ${dateTimeFieldHTML(null, '', 'Invoice Date')}
        <div><label class="label">Customer</label>${searchSelectHTML('nv-cust-ss','Type name or phone...')}<p style="font-size:11px;color:var(--s400);margin-top:4px">Leave empty for Walk-in</p></div>
        <div><label class="label">Add item</label>${searchSelectHTML('nv-prod-ss','Type product name or pack size...')}</div>
        <div id="nv-lines"></div>
        <div class="grid-3">
          <div><label class="label">Discount (₹)</label><input class="input" type="number" step="0.01" id="nv-disc" value="0"></div>
          <div><label class="label">Paid now (₹)</label><input class="input" type="number" step="0.01" id="nv-paid" value="0"></div>
          <div><label class="label">Notes</label><input class="input" id="nv-notes"></div>
        </div>
        <div id="nv-summary" style="background:var(--s50);padding:12px;border-radius:12px;display:flex;justify-content:space-between;font-size:13px;font-weight:500"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
          <a href="#/invoices" class="btn btn-ghost">Cancel</a>
          <button id="nv-save-print" class="btn btn-ghost">Save &amp; Print</button>
          <button id="nv-save" class="btn btn-primary">Save Invoice</button>
        </div>
      </div>
    </div>`;
  const custSS = $('#nv-cust-ss');
  mountSearchSelect(custSS, { items: DB.customers.map(customerToOption), allowAdd: true,
    onAdd: () => { openCustomerFormModal(async (newC) => { await syncDB(); custSS.setItems(DB.customers.map(customerToOption)); custSS.setValue(newC.id); toast('Customer added & selected','success'); }); }
  });
  const prodSS = $('#nv-prod-ss');
  mountSearchSelect(prodSS, { items: ps.map(productToOption), allowAdd: false,
    onSelect: (opt) => { if(!opt) return; const p = ps.find(x => x.id === opt.id); if(!p) return; addProductLine(p); setTimeout(()=>prodSS.reset(), 50); }
  });
  function addProductLine(p){
    if(p.dual){
      const primaryUnit = p.primary_unit === 'pack_unit' ? p.pack_unit : p.base_unit;
      const priceForUnit = primaryUnit === p.pack_unit ? (Number(p.price_pack)||0) : (Number(p.price_base)||0);
      lines.push({ product_id:p.id, product_name:p.name, dual:true, base_unit:p.base_unit, pack_unit:p.pack_unit, pack_size:Number(p.pack_size)||1, price_base:Number(p.price_base)||0, price_pack:Number(p.price_pack)||0, unit:primaryUnit, qty:1, price:priceForUnit, total:priceForUnit });
    } else {
      lines.push({ product_id:p.id, product_name:p.name, dual:false, unit:p.unit, qty:1, price:Number(p.price)||0, total:Number(p.price)||0 });
    }
    renderLines();
  }
  function renderLines(){
    const box = $('#nv-lines');
    if(lines.length===0){ box.innerHTML='<p style="color:var(--s400);font-size:13px">No items added yet</p>'; }
    else{
      box.innerHTML = `<div style="overflow-x:auto"><table><thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Price</th><th style="text-align:right">Total</th><th></th></tr></thead><tbody>${lines.map((l,i)=>{
        const unitCell = l.dual
          ? `<select class="input" data-i="${i}" data-f="unit" style="width:130px;padding:4px 6px"><option value="${l.pack_unit}" ${l.unit===l.pack_unit?'selected':''}>${l.pack_size} ${l.base_unit} (${l.pack_unit})</option><option value="${l.base_unit}" ${l.unit===l.base_unit?'selected':''}>${l.base_unit}</option></select>`
          : `<span style="font-size:12px;color:var(--s600)">${esc(l.unit||'')}</span>`;
        return `<tr><td>${esc(l.product_name)}</td><td><input class="input" type="number" step="0.01" data-i="${i}" data-f="qty" value="${l.qty}" style="width:70px;padding:4px 8px"></td><td>${unitCell}</td><td><input class="input" type="number" step="0.01" data-i="${i}" data-f="price" value="${l.price}" style="width:90px;padding:4px 8px"></td><td style="text-align:right">${rs(l.total)}</td><td><button class="btn btn-ghost btn-sm" data-del="${i}">X</button></td></tr>`;
      }).join('')}</tbody></table></div>`;
      $$('input[data-i]',box).forEach(inp=>inp.oninput=e=>{const i=+e.target.dataset.i,f=e.target.dataset.f;lines[i][f]=Number(e.target.value);lines[i].total=lines[i].qty*lines[i].price;renderLines();});
      $$('select[data-i]',box).forEach(sel=>sel.onchange=e=>{const i=+e.target.dataset.i;lines[i].unit=e.target.value;if(lines[i].dual){lines[i].price=(lines[i].unit===lines[i].pack_unit)?Number(lines[i].price_pack)||0:Number(lines[i].price_base)||0;}lines[i].total=lines[i].qty*lines[i].price;renderLines();});
      $$('[data-del]',box).forEach(b=>b.onclick=()=>{lines.splice(+b.dataset.del,1);renderLines();});
    }
    updateSummary();
  }
  function updateSummary(){
    const sub = lines.reduce((s,l)=>s+l.total,0);
    const d = Number($('#nv-disc').value)||0;
    const tt = Math.max(0,sub-d);
    const pp = Number($('#nv-paid').value)||0;
    const dd = Math.max(0,tt-pp);
    $('#nv-summary').innerHTML = `<div>Subtotal: ${rs(sub)}</div><div style="font-weight:700">Total: ${rs(tt)}</div><div style="color:var(--r600)">Due: ${rs(dd)}</div>`;
  }
  $('#nv-disc').oninput = updateSummary;
  $('#nv-paid').oninput = updateSummary;
  renderLines();
  async function saveInvoice(){
    if(lines.length===0){ toast('Add at least one item','error'); return null; }
    const sc = checkStock(lines);
    if(!sc.ok){ toast('Not enough stock: '+sc.productName+' - need '+fmtNum(sc.need)+' '+sc.unit,'error'); return null; }
    const dEl = document.querySelector('#content input[name="tx_date"]');
    const tEl = document.querySelector('#content input[name="tx_time"]');
    const dv = dEl ? dEl.value : '';
    const tv = (tEl && tEl.value ? tEl.value : '').trim();
    if(!dv){ toast('Please pick a date','error'); return null; }
    if(isFuture(dv)){ toast('Future dates not allowed','error'); return null; }
    const custId = custSS.getValue() || null;
    const disc = Number($('#nv-disc').value)||0;
    const paid = Number($('#nv-paid').value)||0;
    const notes = $('#nv-notes').value;
    const subtotal = lines.reduce((s,l)=>s+l.total,0);
    const total = Math.max(0,subtotal-disc);
    const due = Math.max(0,total-paid);
    const no = nextInvoiceNo();
    const invData = { invoice_no: no, customer_id: custId, subtotal, discount: disc, total, paid, due, notes, invoice_date: dv, tx_time: tv };
    const { data: inv, error: invErr } = await sb.from('invoices').insert(invData).select().single();
    if(invErr){ toast(invErr.message,'error'); return null; }
    const itemRows = lines.map(l=>({ invoice_id: inv.id, product_id: l.product_id, product_name: l.product_name, dual: l.dual||false, base_unit: l.base_unit||null, pack_unit: l.pack_unit||null, pack_size: l.pack_size||null, price_base: l.price_base||0, price_pack: l.price_pack||0, unit: l.unit||null, qty: l.qty, price: l.price, total: l.total }));
    await sb.from('invoice_items').insert(itemRows);
    for(const l of lines){
      const p = DB.products.find(x => x.id === l.product_id);
      if(p){ const ded = lineDeductBaseQty(l); await sb.from('products').update({ stock: Number(p.stock) - ded }).eq('id', p.id); }
    }
    await syncDB();
    return inv;
  }
  $('#nv-save').onclick = async () => {
    const btn = $('#nv-save'); btn.disabled = true; btn.textContent = 'Saving...';
    const inv = await saveInvoice();
    btn.disabled = false; btn.textContent = 'Save Invoice';
    if(inv){ toast('Invoice saved','success'); location.hash = '#/invoice/' + inv.id; }
  };
  $('#nv-save-print').onclick = async () => {
    const btn = $('#nv-save-print'); btn.disabled = true; btn.textContent = 'Saving...';
    const inv = await saveInvoice();
    btn.disabled = false; btn.textContent = 'Save & Print';
    if(!inv) return;
    const items = DB.invoice_items.filter(i => i.invoice_id === inv.id);
    const cust = DB.customers.find(c => c.id === inv.customer_id);
    const kpis = [['Invoice',inv.invoice_no],['Date',txDT(inv,'invoice_date')],['Customer',cust?.name||'Walk-in'],['Total',rs(inv.total)],['Paid',rs(inv.paid)],['Due',rs(inv.due)]];
    const tables = [{head:['Item','Qty','Rate','Amount'],rows:items.map(i=>[productLineLabel(i),i.qty,rs(i.price),rs(i.total)])}];
    setTimeout(()=>printReport('Invoice '+inv.invoice_no,kpis,tables),200);
    location.hash = '#/invoice/' + inv.id;
  };
}

function renderPurchases(content){
  const list = DB.supplier_invoices;
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="page-head"><div><h1 style="font-size:22px;font-weight:700">Purchases - All Bills</h1><p style="color:var(--s500);font-size:13px">Every stock bill from every supplier.</p></div><div class="page-actions">${reportButtonsHTML('pur')}</div></div>
      <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <div style="flex:2;min-width:200px"><label class="label">Search</label><input class="input" id="pur-search" placeholder="Bill no or supplier name..."></div>
        <div style="flex:1;min-width:150px"><label class="label">Sort</label><select class="input" id="pur-sort"><option value="date-desc">Date (newest first)</option><option value="date">Date (oldest first)</option><option value="due-desc">Balance (high first)</option></select></div>
        <div style="flex:0 0 auto"><label class="label">&nbsp;</label><select class="input" id="pur-filter"><option value="">All</option><option value="due">Only with balance</option><option value="paid">Fully paid</option></select></div>
      </div>
      <div class="grid-3" id="pur-stats"></div>
      <div id="pur-count" style="font-size:12px;color:var(--s500);padding:0 4px"></div>
      <div class="card" style="overflow-x:auto"><table><thead><tr><th>Bill No</th><th>Supplier</th><th>Date</th><th style="text-align:right">Total</th><th style="text-align:right">Paid</th><th style="text-align:right">Balance</th><th></th></tr></thead><tbody id="pur-body"></tbody></table></div>
    </div>`;
  function filtered(){
    const q = ($('#pur-search').value||'').toLowerCase().trim();
    const sortBy = $('#pur-sort').value;
    const flt = $('#pur-filter').value;
    let arr = list.filter(b => {
      const sup = DB.suppliers.find(s => s.id === b.supplier_id);
      const hay = ((b.bill_no||'')+' '+(sup?.name||'')).toLowerCase();
      if(q && !hay.includes(q)) return false;
      const bal = Number(b.total) - Number(b.paid);
      if(flt === 'due' && bal <= 0) return false;
      if(flt === 'paid' && bal > 0) return false;
      return true;
    });
    if(sortBy === 'date-desc') arr.sort((a,b)=>txDate(b,'bill_date').localeCompare(txDate(a,'bill_date')));
    else if(sortBy === 'date') arr.sort((a,b)=>txDate(a,'bill_date').localeCompare(txDate(b,'bill_date')));
    else if(sortBy === 'due-desc') arr.sort((a,b)=>(Number(b.total)-Number(b.paid))-(Number(a.total)-Number(a.paid)));
    return arr;
  }
  function renderTable(){
    const arr = filtered();
    $('#pur-count').textContent = arr.length + ' of ' + list.length + ' bills';
    $('#pur-body').innerHTML = arr.length === 0
      ? '<tr><td colspan="7" style="text-align:center;padding:40px"><div style="font-size:40px">(none)</div><p style="color:var(--s500);margin:8px 0">No purchases match</p><a href="#/suppliers" class="btn btn-primary">Go to suppliers</a></td></tr>'
      : arr.map(b=>{
          const sup = DB.suppliers.find(s => s.id === b.supplier_id);
          const bal = Number(b.total) - Number(b.paid);

}

/* ============ PROFIT & LOSS ============ */
function renderPnL(content){
  const today = todayStr();
  const firstOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="page-head"><h1 style="font-size:22px;font-weight:700">Profit &amp; Loss</h1></div>
      <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <div><label class="label">From</label><input class="input" type="date" id="pnl-from" value="${firstOfMonth}" max="${today}"></div>
        <div><label class="label">To</label><input class="input" type="date" id="pnl-to" value="${today}" max="${today}"></div>
        <div><button class="btn btn-primary" id="pnl-load">Load</button></div>
        <div style="flex:1"></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-ghost" id="pnl-today">Today</button><button class="btn btn-ghost" id="pnl-month">This month</button><button class="btn btn-ghost" id="pnl-year">This year</button></div>
      </div>
      <div class="grid-4" id="pnl-stats"></div>
      <div class="card"><h2 style="font-weight:600;margin-bottom:12px">Product-wise Profit</h2><div style="overflow-x:auto"><table><thead><tr><th>Product</th><th style="text-align:right">Sold Qty</th><th style="text-align:right">Revenue</th><th style="text-align:right">Cost</th><th style="text-align:right">Profit</th><th style="text-align:right">Margin %</th></tr></thead><tbody id="pnl-body"></tbody></table></div></div>
      <div class="card" style="display:flex;gap:8px;flex-wrap:wrap"><button id="pnl-print" class="btn btn-ghost">Print</button><button id="pnl-pdf" class="btn btn-primary">PDF</button></div>
    </div>`;
  function compute(from, to){
    const invs = DB.invoices.filter(i => { const d = txDate(i,'invoice_date'); return d >= from && d <= to; });
    const perProduct = {};
    let totalRevenue = 0, totalCost = 0;
    invs.forEach(inv => {
      const items = DB.invoice_items.filter(x => x.invoice_id === inv.id);
      items.forEach(it => {
        const p = DB.products.find(x => x.id === it.product_id);
        const costPerBase = p ? Number(p.cost)||0 : 0;
        const baseQty = lineDeductBaseQty(it);
        const cost = baseQty * costPerBase;
        const rev = Number(it.total)||0;
        const key = it.product_id || it.product_name;
        if(!perProduct[key]) perProduct[key] = { name: it.product_name, revenue:0, cost:0, qty:0, unit: (p ? (p.dual ? p.base_unit : p.unit) : '') };
        perProduct[key].revenue += rev;
        perProduct[key].cost += cost;
        perProduct[key].qty += baseQty;
        totalRevenue += rev;
        totalCost += cost;
      });
    });
    const profit = totalRevenue - totalCost;
    const margin = totalRevenue > 0 ? (profit / totalRevenue) * 100 : 0;
    return { perProduct, totalRevenue, totalCost, profit, margin, count: invs.length };
  }
  function render(){
    const from = $('#pnl-from').value, to = $('#pnl-to').value;
    if(!from || !to){ toast('Pick both dates','error'); return; }
    if(from > to){ toast('From cannot be after To','error'); return; }
    const r = compute(from, to);
    $('#pnl-stats').innerHTML = `<div class="card"><div style="font-size:11px;color:var(--s500)">Revenue</div><div style="font-size:18px;font-weight:700">${rs(r.totalRevenue)}</div><div style="font-size:11px;color:var(--s500);margin-top:2px">${r.count} invoices</div></div><div class="card"><div style="font-size:11px;color:var(--s500)">Cost of Goods</div><div style="font-size:18px;font-weight:700;color:var(--s600)">${rs(r.totalCost)}</div></div><div class="card" style="background:${r.profit>=0?'#f0fdf4':'#fef2f2'}"><div style="font-size:11px;color:var(--s500)">Profit</div><div style="font-size:18px;font-weight:700;color:${r.profit>=0?'var(--b700)':'var(--r600)'}">${rs(r.profit)}</div></div><div class="card"><div style="font-size:11px;color:var(--s500)">Margin</div><div style="font-size:18px;font-weight:700">${r.margin.toFixed(1)}%</div></div>`;
    const rows = Object.values(r.perProduct).sort((a,b)=>(b.revenue-b.cost)-(a.revenue-a.cost));
    $('#pnl-body').innerHTML = rows.length === 0
      ? '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--s500)">No sales in this range</td></tr>'
      : rows.map(x => { const p = x.revenue - x.cost; const m = x.revenue > 0 ? (p/x.revenue)*100 : 0; return `<tr><td>${esc(x.name)}</td><td style="text-align:right">${fmtNum(x.qty)} ${esc(x.unit)}</td><td style="text-align:right">${rs(x.revenue)}</td><td style="text-align:right;color:var(--s600)">${rs(x.cost)}</td><td style="text-align:right;font-weight:600;color:${p>=0?'var(--b700)':'var(--r600)'}">${rs(p)}</td><td style="text-align:right;color:${m>=0?'var(--b700)':'var(--r600)'}">${m.toFixed(1)}%</td></tr>`; }).join('');
    const kpis = [['From',from],['To',to],['Revenue',rs(r.totalRevenue)],['Cost',rs(r.totalCost)],['Profit',rs(r.profit)],['Margin',r.margin.toFixed(1)+'%']];
    const tables = [{title:'Product-wise Profit',head:['Product','Sold Qty','Revenue','Cost','Profit','Margin %'],rows: rows.map(x => { const p = x.revenue-x.cost; const m = x.revenue>0 ? (p/x.revenue)*100 : 0; return [x.name, fmtNum(x.qty)+' '+x.unit, rs(x.revenue), rs(x.cost), rs(p), m.toFixed(1)+'%']; })}];
    const title = 'Profit & Loss '+from+' to '+to;
    $('#pnl-print').onclick = () => printReport(title, kpis, tables);
    $('#pnl-pdf').onclick = () => pdfReport(title, kpis, tables);
  }
  $('#pnl-today').onclick = () => { $('#pnl-from').value = today; $('#pnl-to').value = today; render(); };
  $('#pnl-month').onclick = () => { $('#pnl-from').value = firstOfMonth; $('#pnl-to').value = today; render(); };
  $('#pnl-year').onclick = () => { $('#pnl-from').value = new Date().getFullYear()+'-01-01'; $('#pnl-to').value = today; render(); };
  $('#pnl-load').onclick = render;
  render();
}

async function route(){
  const hash = location.hash || '#/';
  if(hash.startsWith('#/c/')){ await renderPortal(hash.slice(4)); return; }
  if(!SESSION){ renderLogin(); return; }
  if(!DB.settings && !DB.customers.length && !DB.products.length){ await syncDB(); }
  renderLayout();
  const content = $('#content');
  try{
    if(hash === '#/' || hash === '') renderDashboard(content);
    else if(hash === '#/myshop') renderMyShop(content);
    else if(hash === '#/customers') renderCustomers(content);
    else if(hash.startsWith('#/customer/')) await renderCustomerProfile(content, hash.slice(11));
    else if(hash === '#/products') renderProducts(content);
    else if(hash === '#/invoices') renderInvoices(content);
    else if(hash === '#/invoice/new') renderNewInvoice(content);
    else if(hash.startsWith('#/invoice/')) await renderInvoiceView(content, hash.slice(10));
    else if(hash === '#/suppliers') renderSuppliers(content);
    else if(hash.startsWith('#/supplier/')) await renderSupplierProfile(content, hash.slice(11));
    else if(hash === '#/purchases') renderPurchases(content);
    else if(hash === '#/returns') renderReturns(content);
    else if(hash === '#/analytics') renderAnalytics(content);
    else if(hash === '#/pnl') renderPnL(content);
    else if(hash === '#/reports') renderReports(content);
    else if(hash === '#/import') renderImport(content);
    else renderDashboard(content);
  }catch(err){
    console.error(err);
    content.innerHTML = '<div class="card" style="color:var(--r600)">Error: ' + esc(err.message||String(err)) + '</div>';
  }
}

// The direct USB/Bluetooth printing function
async function printThermalReceipt(inv, items, cust) {
  try {
    const device = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x0483 }] });
    const connection = new EscposBuffer.WebUSB(device);
    const printer = await EscposBuffer.Printer.CONNECT('HOP-HL58', connection);
    await printer.setColumns(32); 

    await printer.withStyle({ align: 'center', bold: true }, async () => {
      await printer.writeln(SETTINGS.shop_name);
    });
    await printer.withStyle({ align: 'center' }, async () => {
      await printer.writeln(SETTINGS.owner_name);
      await printer.writeln(SETTINGS.address.substring(0, 32));
      if (SETTINGS.phone) await printer.writeln('Ph: ' + SETTINGS.phone);
    });
    await printer.writeln('--------------------------------');
    await printer.withStyle({ align: 'left' }, async () => {
      await printer.writeln(padLine('Invoice:', inv.invoice_no));
      await printer.writeln(padLine('Date:', txDT(inv, 'invoice_date')));
      await printer.writeln(padLine('Customer:', cust?.name || 'Walk-in'));
    });
    await printer.writeln('--------------------------------');
    await printer.writeln(padLine('Item', 'Amount')); 
    await printer.writeln('--------------------------------');
    for (const item of items) {
      const itemName = productLineLabel(item);
      const qtyPrice = `${item.qty} x ${Number(item.price).toFixed(2)}`;
      const total = Number(item.total).toFixed(2);
      await printer.writeln(itemName.substring(0, 32));
      await printer.writeln(padLine(`  ${qtyPrice}`, total));
    }
    await printer.writeln('--------------------------------');
    await printer.withStyle({ align: 'right' }, async () => {
      await printer.writeln(padLine('Subtotal:', rs(inv.subtotal)));
      if (Number(inv.discount) > 0) await printer.writeln(padLine('Discount:', '-' + rs(inv.discount)));
      await printer.withStyle({ bold: true }, async () => {
        await printer.writeln(padLine('Total:', rs(inv.total)));
      });
      await printer.writeln(padLine('Paid:', rs(inv.paid)));
      await printer.writeln(padLine('Due:', rs(inv.due)));
    });
    await printer.withStyle({ align: 'center' }, async () => {
      await printer.writeln(''); await printer.writeln('Thank you! Visit again.'); await printer.writeln(SETTINGS.upi);
    });
    await printer.feed(4); await printer.cutter();
    toast('Receipt printed perfectly!', 'success');
  } catch (error) {
    console.error('Printing failed:', error);
    toast('Printing failed: ' + error.message, 'error');
  }
}

<script>
let btPrinter = null;

// Helper for perfect 32-character alignment
function padLineBt(left, right, width = 32) {
  left = String(left); right = String(right);
  if (left.length + right.length > width) left = left.substring(0, width - right.length - 1);
  const spaces = ' '.repeat(Math.max(1, width - left.length - right.length));
  return left + spaces + right;
}

// Format money as "Rs.900.00" for the printer
function rsPrinter(n) {
  return 'Rs.' + inr(n); 
}

// NEW: Helper function to print the logo
async function printLogoToEncoder(encoder, logoUrl) {
  if (!logoUrl) return;
  try {
    const img = new Image();
    img.crossOrigin = 'Anonymous'; // Important for web images
    img.src = logoUrl;
    
    // Wait for the image to load
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error('Logo failed to load'));
    });

    // Create a canvas to convert the logo to a format the printer understands
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    
    // 58mm printer max width is 384 dots. Scale the logo down if it's too big.
    const maxWidth = 384; 
    const scale = Math.min(1, maxWidth / img.width);
    canvas.width = img.width * scale;
    canvas.height = img.height * scale;
    
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

    // Send the image to the printer
    encoder.align('center');
    encoder.image(imageData, canvas.width, canvas.height);
    encoder.newline();
  } catch (error) {
    console.log('Logo skipped:', error.message);
    // If the logo fails, we just skip it and print the text instead
  }
}

async function printViaBluetooth(inv, items, cust) {
  if (!navigator.bluetooth) {
    toast('Bluetooth not supported. Try using Chrome on Android.', 'error');
    return;
  }
  if (typeof ReceiptPrinterEncoder === 'undefined' || typeof WebBluetoothReceiptPrinter === 'undefined') {
    toast('Printer libraries not loaded. Check your internet connection.', 'error');
    return;
  }

  try {
    if (!btPrinter) {
      btPrinter = new WebBluetoothReceiptPrinter();
      btPrinter.addEventListener('connected', device => {
        console.log(`Connected to ${device.name}`);
      });
      await btPrinter.connect();
    }

    let encoder = new ReceiptPrinterEncoder({ language: 'esc-pos' });

    // --- NEW: PRINT LOGO FIRST ---
    if (SETTINGS.logo) {
      await printLogoToEncoder(encoder, SETTINGS.logo);
    }

    // --- HEADER ---
    encoder.align('center').bold(true).text(SETTINGS.shop_name || 'Krishi Bandhu').newline();
    encoder.bold(false).text(SETTINGS.owner_name || '').newline();
    encoder.text(SETTINGS.address || '').newline();
    if (SETTINGS.phone) encoder.text('Ph: ' + SETTINGS.phone).newline();
    encoder.text('--------------------------------').newline();

    // --- INVOICE DETAILS ---
    encoder.align('left');
    encoder.text(padLineBt('Invoice:', inv.invoice_no)).newline();
    encoder.text(padLineBt('Date:', txDT(inv, 'invoice_date'))).newline();
    encoder.text(padLineBt('Customer:', cust?.name || 'Walk-in')).newline();
    encoder.text('--------------------------------').newline();

    // --- ITEMS ---
    encoder.text(padLineBt('Item', 'Amount')).newline();
    encoder.text('--------------------------------').newline();

    for (const item of items) {
      const itemName = productLineLabel(item);
      const qtyPrice = `${item.qty} x ${Number(item.price).toFixed(2)}`;
      const total = Number(item.total).toFixed(2);
      encoder.text(itemName.substring(0, 32)).newline();
      encoder.text(padLineBt(`  ${qtyPrice}`, total)).newline();
    }
    encoder.text('--------------------------------').newline();

    // --- TOTALS (FIXED ALIGNMENT) ---
    // Removed align('right') and instead using padLineBt to control exact spacing
    encoder.align('left'); 
    encoder.text(padLineBt('Subtotal:', rsPrinter(inv.subtotal))).newline();
    if (Number(inv.discount) > 0) {
      encoder.text(padLineBt('Discount:', '-' + rsPrinter(inv.discount))).newline();
    }
    encoder.bold(true).text(padLineBt('Total:', rsPrinter(inv.total))).newline();
    encoder.bold(false).text(padLineBt('Paid:', rsPrinter(inv.paid))).newline();
    encoder.text(padLineBt('Due:', rsPrinter(inv.due))).newline();

    // --- FOOTER ---
    encoder.align('center').newline(1).text('Thank you! Visit again.').newline();
    encoder.text(SETTINGS.upi || '').newline(2);
    encoder.cut();

    const data = encoder.encode();
    await btPrinter.print(data);
    toast('Receipt printed successfully!', 'success');
  } catch (error) {
    console.error('Bluetooth printing error:', error);
    toast('Printing failed: ' + error.message, 'error');
    btPrinter = null; 
  }
}

document.addEventListener('click', function(e) {
  if (e.target && e.target.id === 'btn-print') {
    if (location.hash.startsWith('#/invoice/')) {
      const id = location.hash.slice(10);
      const inv = DB.invoices.find(x => x.id === id);
      const items = DB.invoice_items.filter(i => i.invoice_id === id);
      const cust = DB.customers.find(c => c.id === inv.customer_id);
      e.preventDefault();
      e.stopPropagation();
      printViaBluetooth(inv, items, cust);
    }
  }
}, true);
</script>
</body>
