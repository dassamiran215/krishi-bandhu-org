<script>
// ==========================================
// SCRIPT O: WELCOME PAGE (Default Landing)
// ==========================================
(function() {
    // Inject the CSS for the Welcome Screen
    const style = document.createElement('style');
    style.innerHTML = `
        .welcome-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .welcome-bg {
            position: absolute;
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            background-image: url('https://images.unsplash.com/photo-1536145479330-270a31db6900?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: blur(6px);
            z-index: 0;
        }
        .welcome-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.65); /* Dark slate overlay */
            z-index: 1;
        }
        .welcome-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 30px 20px;
            max-width: 500px;
            width: 90%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .welcome-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 0 auto 20px auto;
            background: #fff;
            border-radius: 50%;
            padding: 10px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .welcome-logo-emoji {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
        }
        .welcome-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: #fff;
        }
        .welcome-slogan {
            font-size: 16px;
            font-style: italic;
            color: #a7f3d0;
            margin-bottom: 25px;
        }
        .welcome-details {
            font-size: 14px;
            line-height: 1.8;
            color: #cbd5e1;
            margin-bottom: 30px;
        }
        .welcome-details strong {
            color: #fff;
        }
        .welcome-greeting {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
            color: #fcd34d;
        }
        .btn-enter-shop {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 32px;
            background: #16a34a;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 15px -3px rgba(22, 163, 74, 0.4);
            text-decoration: none;
        }
        .btn-enter-shop:hover {
            background: #15803d;
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(22, 163, 74, 0.5);
        }
        @media (min-width: 768px) {
            .welcome-content { padding: 40px; max-width: 600px; }
            .welcome-title { font-size: 42px; }
            .welcome-slogan { font-size: 18px; }
            .welcome-details { font-size: 16px; }
            .welcome-logo { width: 120px; height: 120px; }
        }
    `;
    document.head.appendChild(style);

    function renderWelcomeScreen() {
        const app = document.getElementById('app');
        const logoHtml = SETTINGS.logo 
            ? `<img src="${SETTINGS.logo}" class="welcome-logo" alt="Logo">`
            : `<span class="welcome-logo-emoji">🌾</span>`;

        app.innerHTML = `
            <div class="welcome-screen">
                <div class="welcome-bg"></div>
                <div class="welcome-overlay"></div>
                <div class="welcome-content">
                    ${logoHtml}
                    <div class="welcome-title">${esc(SETTINGS.shop_name || 'KRISHI BANDHU')}</div>
                    <div class="welcome-slogan">"Your Trusted Partner in Agriculture"</div>
                    <div class="welcome-details">
                        <div><strong>License:</strong> ${esc(SETTINGS.license || 'N/A')}</div>
                        <div><strong>Address:</strong> ${esc(SETTINGS.address || 'N/A')}</div>
                    </div>
                    <div class="welcome-greeting">🙏 Welcome to our shop! 🙏</div>
                    <a href="#/dashboard" class="btn-enter-shop">Enter Shop Management &rarr;</a>
                </div>
            </div>
        `;
    }

    // Override the router to make Welcome the default page
    const _origRoute = window.route;
    window.route = function() {
        const hash = location.hash || '#/';
        
        // Intercept Welcome page (Default landing)
        if (hash === '#/' || hash === '#/welcome') {
            if (typeof SESSION !== 'undefined' && SESSION) {
                renderWelcomeScreen();
                return Promise.resolve();
            }
        }
        
        // Handle Dashboard explicitly
        if (hash === '#/dashboard') {
            if (typeof SESSION !== 'undefined' && SESSION) {
                window.renderLayout(); // Render sidebar/header
                const content = document.getElementById('content');
                if (content) window.renderDashboard(content);
                return Promise.resolve();
            }
        }

        return _origRoute.apply(this, arguments);
    };

    // Update Sidebar to point "Dashboard" link to #/dashboard
    function updateSidebarLinks() {
        const nav = document.querySelector('.nav');
        if (nav) {
            const dashLink = nav.querySelector('a[href="#/"]');
            if (dashLink) {
                dashLink.href = '#/dashboard';
                if (location.hash === '#/dashboard') {
                    nav.querySelectorAll('a').forEach(a => a.classList.remove('active'));
                    dashLink.classList.add('active');
                }
            }
        }
        const mnav = document.getElementById('mobile-nav');
        if (mnav) {
            const dashLink = mnav.querySelector('a[href="#/"]');
            if (dashLink) {
                dashLink.href = '#/dashboard';
                if (location.hash === '#/dashboard') {
                    mnav.querySelectorAll('a').forEach(a => { a.style.color = 'var(--s500)'; a.style.fontWeight = '400'; });
                    dashLink.style.color = 'var(--b700)';
                    dashLink.style.fontWeight = '500';
                }
            }
        }
    }

    // Hook into renderLayout to fix the links right after the sidebar is drawn
    const _origRenderLayout = window.renderLayout;
    window.renderLayout = function() {
        _origRenderLayout.apply(this, arguments);
        updateSidebarLinks();
        setTimeout(updateSidebarLinks, 50);
    };

    // Constant watcher to ensure links stay correct
    setInterval(updateSidebarLinks, 500);
})();
</script>
